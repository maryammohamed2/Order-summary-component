<body>
  <div class="container">
    <section class="one"><div class="img"><img src="images/illustration-hero.svg" alt=""></div></section>
    
 


  <section class="two">
    <h1>  Order Summary</h1>
    <p class="or">You can now listen to millions of songs, audiobooks, and podcasts on any 
      device anywhere you like!</p>
  </section>
  <section class="three">
   <div class="special img-item" ><img src="./images/icon-music.svg" alt="icon"></div> 
   <div class="special"> <h4>Annual Plan</h4>
    <span>$59.99/year</span> 
  </div>
    <br>
    <div class="special"> <a href="">Change</a></div>
     <div class="clear-fix"></div>
  </section>
</div>
